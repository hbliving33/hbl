<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>What We're Watching</title>
<meta name="theme-color" content="#0e0f12">
<link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --line: #2a2d35; --text: #f4f5f7; --muted: #a3a8b4;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; line-height: 1.35;
    padding: max(24px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 40px max(28px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 40px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
  .count { color: var(--muted); font-size: 18px; font-weight: 500; margin-top: 4px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .group { display: flex; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
  .group button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 19px;
    font-weight: 600; padding: 14px 22px; min-height: 54px; cursor: pointer; border-right: 2px solid var(--line); }
  .group button:last-child { border-right: 0; }
  .group button[aria-pressed="true"] { background: var(--accent); color: #0e0f12; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .tile { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 22px 22px 20px;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 168px; }
  .tile h2 { font-size: 27px; font-weight: 700; margin: 0 0 14px; line-height: 1.2; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag { display: inline-block; font-size: 16px; font-weight: 700; padding: 6px 10px; border-radius: 3px; letter-spacing: 0.2px; }
  .who-both { background: #14b8a6; color: #04201c; }
  .who-eric { background: #f59e0b; color: #1f1400; }
  .who-vicki { background: #ec4899; color: #2a0716; }
  .len { background: #3b82f6; color: #fff; }
  .night { background: transparent; border: 2px solid var(--line); color: var(--text); padding: 4px 9px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 18px 20px; border-bottom: 2px solid var(--line); font-size: 21px; }
  th { font-size: 16px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  th .arrow { display: inline-block; width: 18px; color: var(--muted); }
  th[aria-sort] .arrow { color: var(--text); }
  tr:last-child td { border-bottom: 0; }
  td.title { font-weight: 700; font-size: 23px; }

  .empty, .error { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 22px; border: 2px dashed var(--line); border-radius: 6px; }
  .error { color: #ffb4a8; }
  .off { opacity: 0.45; }
  .gone { margin: -6px 0 14px; font-size: 17px; font-weight: 600; color: var(--muted); }
  .addbtn { appearance: none; border: 2px solid var(--accent); background: var(--accent); color: #0e0f12; font: inherit; font-size: 19px;
    font-weight: 700; padding: 14px 22px; min-height: 54px; border-radius: 4px; cursor: pointer; }
  dialog { background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 6px; padding: 28px; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,0.7); }
  dialog h2 { margin: 0 0 20px; font-size: 28px; }
  .field { margin-bottom: 18px; }
  .field > label, .field > .lbl { display: block; font-size: 16px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  .field input, .field select { width: 100%; font: inherit; font-size: 21px; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: 4px; padding: 12px 14px; min-height: 54px; }
  .field .group { width: 100%; }
  .field .group button { flex: 1; }
  .field > label.remember { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 500; color: var(--muted); margin: 10px 0 0; text-transform: none; letter-spacing: 0; }
  .remember input { width: 22px; height: 22px; min-height: 0; }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .actions button { flex: 1; font: inherit; font-size: 19px; font-weight: 700; min-height: 54px; border-radius: 4px; cursor: pointer; }
  .actions .cancel { background: transparent; color: var(--text); border: 2px solid var(--line); }
  .actions .save { background: var(--accent); color: #0e0f12; border: 2px solid var(--accent); }
  .msg { min-height: 26px; margin-top: 14px; font-size: 18px; font-weight: 600; }
  .msg.bad { color: #ffb4a8; } .msg.good { color: #5eead4; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { font-size: 18px; }
    h1 { font-size: 30px; }
    .group button { padding: 12px 14px; font-size: 17px; }
    .grid { grid-template-columns: 1fr; }
    th, td { padding: 14px 12px; font-size: 18px; }
    td.title { font-size: 19px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>What We're Watching</h1>
    <div class="count" id="count">Loading&hellip;</div>
  </div>
  <div class="controls">
    <div class="group" role="group" aria-label="Who is watching">
      <button type="button" data-who="Eric" aria-pressed="false">Eric</button>
      <button type="button" data-who="Vicki" aria-pressed="false">Vicki</button>
      <button type="button" data-who="Together" aria-pressed="true">Together</button>
    </div>
    <div class="group" role="group" aria-label="Which services">
      <button type="button" data-subs="all" aria-pressed="true">All Services</button>
      <button type="button" data-subs="mine" aria-pressed="false">Ours Now</button>
    </div>
    <div class="group" role="group" aria-label="View">
      <button type="button" data-view="tiles" aria-pressed="true">Tiles</button>
      <button type="button" data-view="table" aria-pressed="false">Table</button>
    </div>
    <button type="button" class="addbtn" id="addOpen">+ Add Show</button>
  </div>
</header>

<main>
  <div class="grid" id="tiles"></div>
  <table id="table" hidden>
    <thead><tr>
      <th data-key="title">Show <span class="arrow">&#9650;</span></th>
      <th data-key="service">Service <span class="arrow">&#9650;</span></th>
      <th data-key="watcher">Watching <span class="arrow">&#9650;</span></th>
      <th data-key="night">Night <span class="arrow">&#9650;</span></th>
      <th data-key="avg_minutes">Avg. Length <span class="arrow">&#9650;</span></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Nothing on the list yet.</div>
  <div class="error" id="error" hidden>Couldn't load the list.  Pull down to refresh.</div>
</main>

<dialog id="addDlg">
  <form id="addForm" method="dialog" autocomplete="off">
    <h2>Add a Show</h2>
    <div class="field"><label for="fTitle">Show</label><input id="fTitle" maxlength="80" required autocapitalize="words"></div>
    <div class="field"><label for="fService">Service</label><select id="fService" required></select></div>
    <div class="field"><span class="lbl">Who's watching</span>
      <div class="group" role="group" aria-label="Who is watching">
        <button type="button" data-fwho="Eric" aria-pressed="false">Eric</button>
        <button type="button" data-fwho="Vicki" aria-pressed="false">Vicki</button>
        <button type="button" data-fwho="Both" aria-pressed="true">Together</button>
      </div>
    </div>
    <div class="field"><label for="fNight">Night (live shows only)</label>
      <select id="fNight"><option value="">None, it streams</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div>
    <div class="field"><label for="fPin">PIN</label><input id="fPin" type="password" inputmode="numeric" maxlength="12" required>
      <label class="remember"><input type="checkbox" id="fRemember" checked> Remember the PIN on this device</label></div>
    <div class="msg" id="fMsg" aria-live="polite"></div>
    <div class="actions"><button type="button" class="cancel" id="addCancel">Cancel</button><button type="submit" class="save" id="addSave">Add</button></div>
  </form>
</dialog>

<script>
(() => {
  const SUPABASE_URL = "https://raooyhmkovzshmhgarwm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_apjQYn1UxVPG_Ecwxs3rdQ_ovJix8Fo";

  // Each service always gets the same color: [background, text].
  const SERVICE_COLORS = {
    "netflix": ["#d81f26", "#fff"], "apple tv": ["#f2f3f5", "#111"], "apple tv+": ["#f2f3f5", "#111"],
    "britbox": ["#0d2a6b", "#fff"], "hulu": ["#1ce783", "#0b1a12"], "max": ["#5b2be0", "#fff"], "hbo max": ["#5b2be0", "#fff"],
    "disney+": ["#0e3fa8", "#fff"], "prime video": ["#00a8e1", "#04121a"], "amazon prime": ["#00a8e1", "#04121a"],
    "peacock": ["#ffd200", "#141414"], "paramount+": ["#0064ff", "#fff"], "youtube tv": ["#ff0000", "#fff"],
    "youtube": ["#ff0000", "#fff"], "espn+": ["#b5121b", "#fff"], "tubi": ["#7a2cff", "#fff"],
    "acorn tv": ["#2e7d32", "#fff"], "starz": ["#000", "#fff"], "showtime": ["#b5121b", "#fff"]
  };
  const NIGHTS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const WHO_LABEL = { "Eric": "Eric", "Vicki": "Vicki", "Both": "Together" };

  let shows = [];
  let subscribed = {};
  let services = [];
  let subs = "all";
  let who = "Together";
  let view = "tiles";
  let sortKey = "title", sortDir = 1;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svcStyle = (s) => { const c = SERVICE_COLORS[String(s || "").trim().toLowerCase()] || ["#6b7280", "#fff"]; return "background:" + c[0] + ";color:" + c[1]; };
  const whoClass = (w) => w === "Eric" ? "who-eric" : w === "Vicki" ? "who-vicki" : "who-both";

  const isOff = (s) => subscribed[String(s.service).toLowerCase()] === false;
  function filtered() {
    let list = shows.filter((s) => subs === "all" || !isOff(s)).filter((s) => who === "Together" ? s.watcher === "Both" : s.watcher === who);
    list.sort((a, b) => {
      if (isOff(a) !== isOff(b)) return isOff(a) ? 1 : -1;
      let av, bv;
      if (sortKey === "night") { av = a.night ? NIGHTS.indexOf(a.night) : 99; bv = b.night ? NIGHTS.indexOf(b.night) : 99; }
      else if (sortKey === "avg_minutes") { av = a.avg_minutes || 9999; bv = b.avg_minutes || 9999; }
      else if (sortKey === "watcher") { av = WHO_LABEL[a.watcher] || ""; bv = WHO_LABEL[b.watcher] || ""; }
      else { av = String(a[sortKey] || "").toLowerCase(); bv = String(b[sortKey] || "").toLowerCase(); }
      if (av < bv) return -sortDir;
      if (av > bv) return sortDir;
      return String(a.title).localeCompare(String(b.title));
    });
    return list;
  }

  function render() {
    const list = filtered();
    $("count").textContent = list.length === 1 ? "1 show" : list.length + " shows";
    $("empty").hidden = list.length > 0;
    $("tiles").hidden = view !== "tiles" || list.length === 0;
    $("table").hidden = view !== "table" || list.length === 0;

    $("tiles").innerHTML = list.map((s) =>
      '<article class="tile' + (isOff(s) ? ' off' : '') + '"><div><h2>' + esc(s.title) + '</h2>' + (isOff(s) ? '<p class="gone">Not subscribed right now</p>' : '') + '</div><div class="meta">' +
      '<span class="tag svc" style="' + svcStyle(s.service) + '">' + esc(s.service) + '</span>' +
      '<span class="tag ' + whoClass(s.watcher) + '">' + esc(WHO_LABEL[s.watcher] || s.watcher) + '</span>' +
      (s.night ? '<span class="tag night">' + esc(s.night) + 's</span>' : '') +
      (s.avg_minutes ? '<span class="tag len">' + esc(s.avg_minutes) + ' min</span>' : '') +
      '</div></article>').join("");

    $("rows").innerHTML = list.map((s) =>
      '<tr' + (isOff(s) ? ' class="off"' : '') + '><td class="title">' + esc(s.title) + '</td>' +
      '<td><span class="tag svc" style="' + svcStyle(s.service) + '">' + esc(s.service) + '</span></td>' +
      '<td><span class="tag ' + whoClass(s.watcher) + '">' + esc(WHO_LABEL[s.watcher] || s.watcher) + '</span></td>' +
      '<td>' + (s.night ? esc(s.night) + 's' : '') + '</td>' +
      '<td>' + (s.avg_minutes ? '<span class="tag len">' + esc(s.avg_minutes) + ' min</span>' : '') + '</td></tr>').join("");

    document.querySelectorAll("th[data-key]").forEach((th) => {
      const on = th.dataset.key === sortKey;
      if (on) th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending"); else th.removeAttribute("aria-sort");
      th.querySelector(".arrow").innerHTML = on && sortDir === -1 ? "&#9660;" : "&#9650;";
    });
  }

  function press(groupAttr, value) {
    document.querySelectorAll("[data-" + groupAttr + "]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[groupAttr] === value)));
  }

  document.querySelectorAll("[data-who]").forEach((b) => b.addEventListener("click", () => { who = b.dataset.who; press("who", who); save(); render(); }));
  document.querySelectorAll("[data-subs]").forEach((b) => b.addEventListener("click", () => { subs = b.dataset.subs; press("subs", subs); save(); render(); }));
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; press("view", view); save(); render(); }));
  document.querySelectorAll("th[data-key]").forEach((th) => th.addEventListener("click", () => {
    if (sortKey === th.dataset.key) sortDir = -sortDir; else { sortKey = th.dataset.key; sortDir = 1; }
    render();
  }));

  function save() { try { localStorage.setItem("tv-prefs", JSON.stringify({ who, view, subs })); } catch (e) {} }
  try { const p = JSON.parse(localStorage.getItem("tv-prefs") || "{}"); if (["Eric","Vicki","Together"].includes(p.who)) who = p.who; if (p.view) view = p.view; if (p.subs) subs = p.subs; } catch (e) {}
  press("who", who); press("view", view); press("subs", subs);

  // Add a show
  const dlg = $("addDlg");
  let fwho = "Both";
  document.querySelectorAll("[data-fwho]").forEach((b) => b.addEventListener("click", () => { fwho = b.dataset.fwho; press("fwho", fwho); }));
  $("addOpen").addEventListener("click", () => {
    const names = services.map((r) => r.name).sort((a, b) => a.localeCompare(b));
    $("fService").innerHTML = '<option value="">Pick one</option>' + names.map((n) => '<option>' + esc(n) + '</option>').join("");
    $("fTitle").value = ""; $("fNight").value = ""; $("fMsg").textContent = ""; $("fMsg").className = "msg";
    fwho = "Both"; press("fwho", fwho);
    try { $("fPin").value = localStorage.getItem("tv-pin") || ""; } catch (e) { $("fPin").value = ""; }
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(() => $("fTitle").focus(), 50);
  });
  $("addCancel").addEventListener("click", () => dlg.close());
  $("addForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const msg = $("fMsg"); msg.className = "msg"; msg.textContent = "Adding…";
    const pin = $("fPin").value.trim();
    $("addSave").disabled = true;
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/tv_add_show", {
        method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_pin: pin, p_title: $("fTitle").value, p_service: $("fService").value, p_watcher: fwho, p_night: $("fNight").value || null })
      });
      const out = res.ok ? await res.json() : "Something went wrong.  Try again.";
      if (out === "ok") {
        try { if ($("fRemember").checked) localStorage.setItem("tv-pin", pin); else localStorage.removeItem("tv-pin"); } catch (e) {}
        msg.className = "msg good"; msg.textContent = "Added.";
        await load();
        setTimeout(() => dlg.close(), 700);
      } else {
        if (out === "Wrong PIN.") { try { localStorage.removeItem("tv-pin"); } catch (e) {} }
        msg.className = "msg bad"; msg.textContent = out;
      }
    } catch (e) {
      msg.className = "msg bad"; msg.textContent = "No connection.  Try again.";
    }
    $("addSave").disabled = false;
  });

  async function load() {
    try {
      const hdr = { headers: { apikey: SUPABASE_KEY }, cache: "no-store" };
      const sres = await fetch(SUPABASE_URL + "/rest/v1/tv_services?select=name,subscribed", hdr);
      if (sres.ok) { subscribed = {}; services = await sres.json(); services.forEach((r) => { subscribed[String(r.name).toLowerCase()] = r.subscribed; }); }
      const res = await fetch(SUPABASE_URL + "/rest/v1/tv_shows?select=title,service,watcher,night,avg_minutes&order=title.asc", {
        headers: { apikey: SUPABASE_KEY }, cache: "no-store"
      });
      if (!res.ok) throw new Error(res.status);
      shows = await res.json();
      $("error").hidden = true;
      render();
    } catch (e) {
      $("count").textContent = "";
      $("error").hidden = false;
    }
  }
  load();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
